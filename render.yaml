# Reports and measurements live in the SQLite file from DATABASE_PATH.
# This file does not attach a paid disk and does not change the current plan.
# A lasting copy needs DATABASE_PATH on storage that survives redeploys.
services:
  - type: web
    name: meta-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_web.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENABLE_SCHEDULER
        value: "1"

  - type: cron
    name: dashboard-wake
    runtime: python
    plan: free
    schedule: "0 5-19 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/wake_dashboard.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DASHBOARD_URL
        value: https://meta-dashboard.onrender.com
