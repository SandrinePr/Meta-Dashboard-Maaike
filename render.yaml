# HAMSTER (Maaike) — React SPA + FastAPI from SandrinePr/Meta-Dashboard-Maaike.
# Free plan: no persistent disk. Enable remote JSON backup via MAAIKE_PERSIST_*.
services:
  - type: web
    name: hamster
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt && cd frontend && npm ci && VITE_API_URL= npm run build
    startCommand: uvicorn maaike_web.app:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: NODE_VERSION
        value: "20.18.1"
      - key: MAAIKE_DATABASE_PATH
        value: /tmp/maaike_redrock.db
      - key: MAAIKE_THUMB_DIR
        value: /tmp/maaike_thumbs
      - key: ENABLE_SCHEDULER
        value: "0"
      - key: ENABLE_REPORT_PLANNING_SCHEDULER
        value: "0"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Prefer explicit URLs; otherwise the app uses RENDER_EXTERNAL_URL.
      - key: MAAIKE_FRONTEND_URL
        sync: false
      - key: MAAIKE_BACKEND_URL
        sync: false
      - key: MAAIKE_CORS_ORIGINS
        sync: false
      - key: MAAIKE_WEB_OAUTH_REDIRECT_URI
        sync: false
      - key: MAAIKE_SESSION_SECRET
        generateValue: true
      - key: MAAIKE_BASIC_AUTH_USER
        value: maaike
      - key: MAAIKE_BASIC_AUTH_PASSWORD
        sync: false
      - key: MAAIKE_META_APP_ID
        sync: false
      - key: MAAIKE_META_APP_SECRET
        sync: false
      - key: MAAIKE_META_GRAPH_API_VERSION
        value: v25.0
      - key: MAAIKE_META_LOGIN_CONFIG_ID
        sync: false
      - key: AI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: AI_MODEL
        value: gemini-3.5-flash-lite
      - key: AI_API_KEY
        sync: false
      - key: CLAUDE_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-5
      - key: FIGMA_ACCESS_TOKEN
        sync: false
      # Optional Canva Connect user token (design:content:read) for direct strategy import.
      - key: CANVA_ACCESS_TOKEN
        sync: false
      # Free-tier lasting storage: private HAMSTER GitHub Contents (no secrets in package)
      - key: MAAIKE_PERSIST_ENABLED
        value: "1"
      - key: MAAIKE_PERSIST_BACKUP_URL
        value: https://api.github.com/repos/SandrinePr/hamster-persist/contents/hamster-maaike-backup.json
      - key: MAAIKE_PERSIST_TOKEN
        sync: false
      - key: MAAIKE_PERSIST_PROVIDER
        value: github
      # External wake-up for monthly trend on Render Free (GitHub Actions cron).
      # Same secret value must be stored as GitHub Actions secret MAAIKE_CRON_SECRET.
      - key: MAAIKE_CRON_SECRET
        sync: false
      # Keep 0 until paid monthly AI is explicitly approved. Trigger still wakes + catch-up works.
      - key: ENABLE_MONTHLY_TREND_PAID_AI
        value: "0"
      - key: MAAIKE_MONTHLY_TREND_ACTIVE_FROM
        value: "2026-12-01"
